<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table, tr, td{
            border: 1px solid black;
            text-align: center;
            padding: 1px;
        }
    </style>
</head>
<body>
    
    <table width=100% border="1">
        <tr>
            <td colspan="3">1 2 3</td>

            <td rowspan="3">4 <br>8 <br>12</td>
        </tr>

        <tr>
            <td>5</td>
            <td>6</td>
            <td>7</td>

        </tr>

        <tr>
            <td colspan="2">9 10</td>

            <td>11</td>

        </tr>


    </table>

    <tfoot>
        <tr>
            <td colspan="3"></td>
        </tr>
    </tfoot>

</body>
</html>
