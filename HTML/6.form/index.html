<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>


    <!-- name is just a variable that will passed to our backend -->
    <form action="" method="post">
        <fieldset>
            <legend>Student Information</legend>
            <label for="">First Name</label>
            <input type="text" name="first_name" placeholder="      your first name">
            <br>

            <label for="">Last Name</label>
            <input type="text" name="last_name" placeholder="          your last name">
            <br>
            <label for="">Email</label>
            <input type="email" name = "email" placeholder="abc@gmail.com">

            <br><br>
            <label for="">Date of Birth</label>
            <input type="date" name = "date_variable">

            <br>
            <label for="">File</label>
            <input type="file" name = "file">
            
            <br><br>
            <label for="">Gender:</label>
            <br>
            <label for="">male</label>
            <input type="radio" name = "gender_variable" value="male">
            <label for="">female</label>
            <input type="radio" name = "gender_variable" value="female">
            <br><br>

            <br><br>
            <label for="">Phone</label>
            <input type="tel" name="tel">
            <input type="color" >

            <br>
            <label for="">checkbox</label>
            <input type="checkbox">

            <br><br>
            <label for="">Feedback</label>
            <textarea id = "Feedback" rows = "4" colomns = "3"></textarea>
            <input type="submit">

            <br><br>
            <label for="">range</label>
            <input type="range">

            <br><br>

            <label for="">Search</label>
            <input type="search">

            <br><br>
            <button type="submit">submit</button>

            <br><br>
            <select name="Country" id="">
                <option value="cambodia">Cambodia</option>
                <option value="usa">USA</option>
                <option value="england">England</option>
            </select>


            <select name="category" multiple>
                
                <option value="1">Option1</option>
                <option value="2">Option2</option>
                <option value="3">Option3</option>
                <option value="4">Option4</option>
                <option value="5">Option5</option>

            </select>
             
        </fieldset>
    </form>
</body>
</html>
