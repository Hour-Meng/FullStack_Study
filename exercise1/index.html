<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<body bgcolor="#adfbff">
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

    <div class="container">
    <!-- Content here -->
        <div class="row">
            <div class="col-md-12">
                <div class="card" style="width: 18rem;">
                    <div class="card-body">
                        <h5 class="card-title">Math Calculator</h5>

                            <div class="mt-3">
                                 <label for="" class="form-label">Value 1</label>
                                 <input type="number" name="" id="value1" class="form-control" placeholder="Please enter a value">

                            </div>
                            
                            <div class="mt-3">

                                  <label for="" class="form-label">Value 2</label>
                                    <input type="number" name="" id="value2" class="form-control" placeholder="Please enter a value">
                                </div>


                            <div>
                                <div class="mt-3 text-center">
                                    <button type="button" class="btn btn-primary" value="add">+</button>
                                    <button type="button" class="btn btn-primary" value="sub">-</button>
                                    <button type="button" class="btn btn-primary" value="multiplication">*</button>
                                    <button type="button" class="btn btn-primary" value="divide">/</button>
                                    <button type="button" class="btn btn-primary" value="module">%</button>
                                </div>
                            </div>


                            </div>

                                <div class="mt-3">
                                    <label for="" class="form-label">Result</label>
                                    <input type="text" name="" id="result" class="form-control" readonly>
                                
                                </div>
                            </div>
                            
                    </div>

                    <script src="cal.js">

                    </script>
                </div>
            </div>
        </div>
    </div>
