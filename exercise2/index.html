<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</head>
<body bgcolor="#adfbff">
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Parking Calculator</h5>

                        <div class="mt-3">
                            <label for="vehicle" class="form-label">Select Vehicle</label>
                            <select id="vehicle" class="form-control" onchange="calculatePrice()">
                                <option value="car">Car</option>
                                <option value="moto">Motorcycle</option>
                            </select>
                        </div>

                        <div class="mt-3">
                            <label for="Time" class="form-label">Check in time</label>
                            <input type="time" id="Time" class="form-control" onchange="calculatePrice()">
                        </div>

                        <div class="mt-3">
                            <label for="value2" class="form-label">Check out time</label>
                            <input type="time" id="value2" class="form-control" onchange="calculatePrice()">
                        </div>

                        <div class="mt-3">
                            <label for="result" class="form-label">Price</label>
                            <input type="text" id="result" class="form-control" readonly>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function calculatePrice() {
            let vehicle = document.getElementById('vehicle').value;
            let checkIn = document.getElementById('Time').value;
            let checkOut = document.getElementById('value2').value;
            let result = document.getElementById('result');

            if (!checkIn || !checkOut) {
                result.value = '';
                return;
            }

            let start = new Date(`1970-01-01T${checkIn}:00`);
            let end = new Date(`1970-01-01T${checkOut}:00`);
            let totalHours = (end - start) / (1000 * 60 * 60);

            if (totalHours < 0) {
                totalHours += 24;
            }

            let price = 0;

            if (vehicle === 'car') {
                if (totalHours <= 8) {
                    price = 500;
                } else {
                    price = 1000;
                }
            } else if (vehicle === 'moto') {
                if (totalHours <= 8) {
                    price = 200;
                } else {
                    price = 300;
                }
            }

            result.value = price;
        }

        calculatePrice();
    </script>

</body>
</html>
