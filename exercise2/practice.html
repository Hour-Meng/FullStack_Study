<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>


</head>
<body>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>


    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5>Parking Ticket</h5>
                        <div class="mt-3">
                            <label for="" class="form-label">Choose your vehicle</label>
                            <select name="" id="option" class="form-control">
                                <option value="car">Car</option>
                                <option value="moto">Moto</option>
                            </select>
                        </div>

                        <div class="mt-3">
                            <label for="" class="form-label">Enter check in time</label>
                            <input type="time" id="check-in" class="form-control" onchange="calculate()">
                        </div>

                        <div class="mt-3">
                            <label for="" class="form-label">Enter check out time</label>
                            <input type="time" class="form-control" id="check-out" onchange="calculate()">
                        </div>
                        
                        <div class="mt-3">
                            <label for="" class="form-label">Price in $</label>
                            <input type="text" class="form-control" readonly id="dollar">
                        </div>

                        <div class="mt-3">
                            <label for="" class="form-label">Price in ៛</label>
                            <input type="text" class="form-control" readonly id="riel">
                        </div>
                    </div>
                </div>
            </div>
        </div>
  <!-- Content here -->
        
    </div>


    <script>
        function calculate(){
            let option = document.getElementById('option').value;
            let checkin = document.getElementById('check-in').value;
            let checkout = document.getElementById('check-out').value;
            let dollar = document.getElementById('dollar');
            let riel = document.getElementById('riel');

            
            if (!checkin || !checkout){
                riel.value = '';
                dollar.value = '';
                
                return ;
            }
            

            let checkIn = new Date(`1991-01-01T${checkin}:00`);
            let checkOut = new Date(`1991-01-01T${checkout}:00`);

            let totalTime = (checkOut - checkIn)/(1000*60*60);

            console.log(totalTime);

            if (totalTime <= 0 ){
                totalTime += 24;
            }

            console.log(totalTime);

            if (totalTime < 8){
                riel.value = option == 'moto' ?totalTime * 200 :totalTime *300;
            }
            else{
                riel.value = option == 'moto' ?totalTime * 300 :totalTime *500;
            }

            dollar.value = riel.value / 4000;
            console.log(dollar.value);

        }

        calculate();
    </script>

    
</body>
</html>
